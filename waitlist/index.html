<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monthly Saver · Join the Hyderabad waitlist</title>
<meta name="description" content="Save your family's monthly provisions list once. Bill Day reminders, household bill reminders, budget and pantry tracking. Coming soon to Hyderabad.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&family=Noto+Sans+Telugu:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <span class="brand">Monthly Saver</span>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">English</button>
      <button type="button" data-lang="te" aria-pressed="false">తెలుగు</button>
      <button type="button" data-lang="hi" aria-pressed="false">हिन्दी</button>
    </div>
  </div>
</header>

<main>
  <section class="hero">
    <div class="wrap hero-grid">
      <div>
        <p class="eyebrow" data-i18n="eyebrow"></p>
        <h1 data-i18n="h1"></h1>
        <p class="lede" data-i18n="lede"></p>
        <a class="cta" href="#join" data-i18n="cta"></a>
        <p class="price" data-i18n="price"></p>
      </div>
      <div class="list-card" aria-hidden="true">
        <div class="lc-head"><span data-i18n="cardTitle"></span><span class="lc-day" data-i18n="cardDay"></span></div>
        <ul>
          <li><span data-i18n="i1"></span><span>2 kg</span></li>
          <li><span data-i18n="i2"></span><span>5 kg</span></li>
          <li><span data-i18n="i3"></span><span>2 L</span></li>
          <li><span data-i18n="i4"></span><span>1 kg</span></li>
          <li><span data-i18n="i5"></span><span>500 g</span></li>
        </ul>
        <div class="lc-foot" data-i18n="cardFoot"></div>
      </div>
    </div>
  </section>

  <section class="features">
    <div class="wrap">
      <h2 data-i18n="featTitle"></h2>
      <div class="grid">
        <div class="feat"><h3 data-i18n="f1t"></h3><p data-i18n="f1d"></p></div>
        <div class="feat"><h3 data-i18n="f2t"></h3><p data-i18n="f2d"></p></div>
        <div class="feat"><h3 data-i18n="f3t"></h3><p data-i18n="f3d"></p></div>
        <div class="feat"><h3 data-i18n="f4t"></h3><p data-i18n="f4d"></p></div>
      </div>
      <p class="next"><strong data-i18n="nextLabel"></strong> <span data-i18n="nextText"></span></p>
    </div>
  </section>

  <section class="join" id="join">
    <div class="wrap narrow">
      <h2 data-i18n="joinTitle"></h2>
      <p class="sub" data-i18n="joinSub"></p>
      <form id="waitlist" novalidate>
        <label><span data-i18n="lName"></span>
          <input name="name" autocomplete="name" required maxlength="80"></label>
        <label><span data-i18n="lPhone"></span>
          <input name="phone" type="tel" inputmode="numeric" autocomplete="tel-national" required pattern="[6-9][0-9]{9}" maxlength="10" placeholder="98xxxxxxxx"></label>
        <div class="row">
          <label><span data-i18n="lArea"></span>
            <input name="area" required maxlength="60" data-i18n-ph="phArea"></label>
          <label><span data-i18n="lPin"></span>
            <input name="pincode" inputmode="numeric" required pattern="5[0-9]{5}" maxlength="6" placeholder="500072"></label>
        </div>
        <div class="row">
          <label><span data-i18n="lFamily"></span>
            <select name="family_size" required>
              <option value="" data-i18n="choose"></option>
              <option value="1-2">1–2</option>
              <option value="3-4">3–4</option>
              <option value="5+">5+</option>
            </select></label>
          <label><span data-i18n="lSpend"></span>
            <select name="monthly_spend" required>
              <option value="" data-i18n="choose"></option>
              <option value="<3000">&lt; ₹3,000</option>
              <option value="3000-6000">₹3,000–6,000</option>
              <option value="6000-10000">₹6,000–10,000</option>
              <option value=">10000">&gt; ₹10,000</option>
            </select></label>
        </div>
        <fieldset>
          <legend data-i18n="lApps"></legend>
          <div class="chips">
            <label class="chip"><input type="checkbox" name="apps" value="instamart"> Swiggy Instamart</label>
            <label class="chip"><input type="checkbox" name="apps" value="zepto"> Zepto</label>
            <label class="chip"><input type="checkbox" name="apps" value="blinkit"> Blinkit</label>
            <label class="chip"><input type="checkbox" name="apps" value="bigbasket"> BigBasket</label>
            <label class="chip"><input type="checkbox" name="apps" value="jiomart"> JioMart</label>
            <label class="chip"><input type="checkbox" name="apps" value="dmart"> DMart Ready</label>
            <label class="chip"><input type="checkbox" name="apps" value="flipkart"> Flipkart Minutes</label>
            <label class="chip"><input type="checkbox" name="apps" value="kirana"> <span data-i18n="kirana"></span></label>
          </div>
        </fieldset>
        <fieldset>
          <legend data-i18n="lPay"></legend>
          <div class="chips">
            <label class="chip"><input type="radio" name="would_pay" value="yes" required> <span data-i18n="yes"></span></label>
            <label class="chip"><input type="radio" name="would_pay" value="maybe"> <span data-i18n="maybe"></span></label>
            <label class="chip"><input type="radio" name="would_pay" value="no"> <span data-i18n="no"></span></label>
          </div>
        </fieldset>
        <label><span data-i18n="lWant"></span>
          <textarea name="wish" rows="2" maxlength="300"></textarea></label>
        <label class="hp" aria-hidden="true">Website <input name="website" tabindex="-1" autocomplete="off"></label>
        <label class="consent"><input type="checkbox" name="consent" required> <span data-i18n="consent"></span></label>
        <p class="err" id="err" role="alert" hidden></p>
        <button type="submit" class="cta" data-i18n="submit"></button>
      </form>
      <div class="done" id="done" hidden>
        <h3 data-i18n="doneT"></h3>
        <p data-i18n="doneD"></p>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <p data-i18n="privacy"></p>
    <p data-i18n="affil"></p>
    <p>© 2026 Sreekar AI Technologies</p>
  </div>
</footer>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
